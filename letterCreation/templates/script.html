<script>
    document.addEventListener('DOMContentLoaded', () => {
        const dropdowns = document.querySelectorAll('.dropdown > a');
        const lists = document.querySelectorAll('.list');

        // Function to save the state of dropdowns
        function saveDropdownState() {
            dropdowns.forEach((dropdown, index) => {
                const parent = dropdown.parentElement;
                const isActive = parent.classList.contains('active');
                localStorage.setItem(`dropdownState-${index}`, isActive);
            });
        }

        // Restore dropdown states from local storage
        function restoreDropdownState() {
            dropdowns.forEach((dropdown, index) => {
                const parent = dropdown.parentElement;
                const state = localStorage.getItem(`dropdownState-${index}`);
                if (state === 'true') {
                    parent.classList.add('active');
                } else {
                    parent.classList.remove('active');
                }
            });
        }

        // Set active state based on current URL
        function setActiveBasedOnUrl() {
            const currentPath = window.location.pathname.replace(/\/$/, ''); // Trim trailing slash
            lists.forEach((el) => {
                const link = el.querySelector('a');
                if (link) {
                    const linkPath = link.getAttribute('href').replace(/\/$/, ''); // Trim trailing slash
                    if (linkPath === currentPath) {
                        el.classList.add('active');
                        const parentDropdown = el.closest('.dropdown');
                        if (parentDropdown) {
                            parentDropdown.classList.add('active');
                        }
                    } else {
                        el.classList.remove('active');
                    }
                }
            });
        }

        // Event listener for dropdowns to toggle active class and save state
        dropdowns.forEach((dropdown) => {
            dropdown.addEventListener('click', (event) => {
                event.preventDefault();
                const parent = dropdown.parentElement;
                parent.classList.toggle('active');
                saveDropdownState();
            });
        });

        // Event listener for list items to set active state
        lists.forEach((el) => el.addEventListener('click', (event) => {
            event.stopPropagation(); // Prevent the event from bubbling up to the dropdown toggle
            lists.forEach(item => item.classList.remove('active'));
            el.classList.add('active');
            saveDropdownState(); // Save state when a link is clicked
        }));

        // Restore the dropdown state and set active item on page load
        restoreDropdownState();
        setActiveBasedOnUrl();

        // Toggle sidebar and content active state
        const toggleButton = document.querySelector('.toggle');
        const navigation = document.querySelector('.navigation');
        const content = document.querySelector('main.content');

        toggleButton.addEventListener('click', () => {
            navigation.classList.toggle('active');
            content.classList.toggle('active');
        });
    });
</script>
