{% extends 'sidebar.html' %}
{% load static %}
{% block content %} 
<!DOCTYPE html>
<html lang="en">


<head>
  <link
  href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
  rel="stylesheet"
/>
<!-- Font Awesome CDN -->
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
/>


    <style>
      body {
        font-family: 'Poppins',sans-serif;
        font-size: 18px;
    }



    .input-line:focus {
        border-color: #3ab1df;
        border-width: 0 0 2px 0;
        outline: none;
    }

 
    .subproduct-section {
        border: 2px solid #3ab1df;
        padding: 1rem;
        border-radius: 0.5rem;
        margin-bottom: 1rem;
    }


   .product-section h2,
    .subproduct-section h4 {
        color: #3593aa;
        margin-bottom: 0.5rem;
    }


    .product-section input,
    .subproduct-section input {
        border: 1px solid #3ab1df;
        border-radius: 0.25rem;
        padding: 0.5rem;
        margin-bottom: 0.5rem;
        width: 100%;
        max-width: 100%;
    }

    .product-section button,
    .subproduct-section button {
        background-color: transparent;
        border: 2px solid #3ab1df;
        color: #3593aa;
        font-weight: bold;
        padding: 0.5rem 1rem;
        border-radius: 0.25rem;
        cursor: pointer;
        transition: background-color 0.3s, color 0.3s;
    }



    .product-section button:hover,
    .subproduct-section button:hover {
        background-color: #3ab1df;
        color: white;
    }


    .hover-text-blue-900:hover {
        color: #0f3d57; /* Change to your desired hover color */
    }


    .btn{
        border-color: #3ab1df;
        color:#3593aa;
        border: 2px solid #3ab1df;
          }
         
          .btn:hover {
            background-color: #3ab1df;
            color: white;
          }


          .bg-custom-color{
            color: #3ab1df;
          }

          .title-custom-color{
            color: #3ab1df;
          }


          .bg-custom-color:hover {
            background-color: #2c7da0; 
        }

        

    </style>
   <!-- Select2 CSS -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.1.0/css/select2.min.css" rel="stylesheet" />

<!-- Select2 JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.1.0/js/select2.min.js"></script>

    
</head>


<body class="bg-gray-100">
   
    <div class="container mx-auto py-6">
        <div class="max-w-3xl mx-auto bg-white p-6 rounded-md shadow-md">
            <h2 class="text-2xl font-bold mb-4 title-custom-color">Product Details</h2>
            <div class="flex flex-wrap">
                <div class="relative flex-1 mr-4">
                    <input placeholder="Letter No" type="text" id="letter_no" name="letter_no" class="input-line peer h-11 w-full border-b border-blue-gray-200 bg-transparent pt-4 pb-1.5 font-sans text-base font-normal text-blue-gray-700 outline outline-0 transition-all placeholder-shown:border-blue-gray-200 focus:border-gray-900 focus:outline-0 disabled:border-0 disabled:bg-blue-gray-50" />
                    <label for="letter_no" class="text-xl after:content[' '] absolute left-0 -top-2.5 flex w-full select-none !overflow-visible truncate text-base font-normal leading-tight text-gray-500 transition-all after:absolute after:-bottom-2.5 after:block after:w-full after:scale-x-0 after:border-b-2 after:border-gray-500 after:transition-transform after:duration-300 peer-placeholder-shown:leading-tight peer-placeholder-shown:text-blue-gray-500 peer-focus:text-base peer-focus:leading-tight peer-focus:text-gray-900 peer-focus:after:scale-x-100 peer-focus:after:border-gray-900 peer-disabled:text-transparent peer-disabled:peer-placeholder-shown:text-blue-gray-500">
                        Letter No
                    </label>
                </div>
                <div class="relative flex-1 mr-4">
                    <select id="lab_select" name="lab_select" class="block py-2.5 px-0 w-full text-sm text-gray-500 bg-transparent border-0 border-b-2 border-gray-200 appearance-none dark:text-gray-400 dark:border-gray-700 focus:outline-none focus:ring-0 focus:border-gray-200 peer">
                        {% for lab in labs %}
                        <option value="{{ lab.id }}">{{ lab.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="relative flex-1">
                    <input placeholder="Date" type="date" id="letter_date" name="letter_date" class="input-line peer h-11 w-full border-b border-blue-gray-200 bg-transparent pt-4 pb-1.5 font-sans text-base font-normal text-blue-gray-700 outline outline-0 transition-all placeholder-shown:border-blue-gray-200 focus:border-gray-900 focus:outline-0 disabled:border-0 disabled:bg-blue-gray-50" />
                    <label for="letter_date" class="text-xl after:content[' '] absolute left-0 -top-2.5 flex w-full select-none !overflow-visible truncate text- font-normal leading-tight text-gray-500 transition-all after:absolute after:-bottom-2.5 after:block after:w-full after:scale-x-0 after:border-b-2 after:border-gray-500 after:transition-transform after:duration-300 peer-placeholder-shown:leading-tight peer-placeholder-shown:text-blue-gray-500 peer-focus:text-base peer-focus:leading-tight peer-focus:text-gray-900 peer-focus:after:scale-x-100 peer-focus:after:border-gray-900 peer-disabled:text-transparent peer-disabled:peer-placeholder-shown:text-blue-gray-500">
                        Date
                    </label>
                </div>
            </div><br><br>
           
            <label for="main_item" class="sr-only">Main Item</label>
                <input id="main_item" name="main_item" class="block py-2.5 px-0 w-full text-sm text-gray-500 bg-transparent border-0 border-b-2 border-gray-200 appearance-none dark:text-gray-400 dark:border-gray-700 focus:outline-none focus:ring-0 focus:border-gray-200 peer" list="main_item_list">
                
                
                <datalist id="main_item_list">
                    {% for main_item in main_items %}
                        <option value="{{ main_item.name }}" data-id="{{ main_item.id }}">
                    {% endfor %}
                </datalist>
                
                
            <select id="manufacturer">
                <option value="">Select Manufacturer</option>
            </select>
            
            
            <div id="productDetails">
                <!-- Product Detail Section -->
            </div>
            

          <div class="flex justify-start">
            <button onclick="addProduct()" class="btn font-bold py-2 px-4 rounded mt-6 mr-6">
                <i class="fas fa-plus"></i> Add Product
            </button>
            <button onclick="submitForm()" class="border-2 border-green-500 text-green-500 hover:bg-green-500 hover:text-white font-bold py-2 px-4 rounded mt-6">
                <i class="fas fa-check"></i> Submit
            </button>
        </div>
        

        </div>
    </div>



    <script>
        // Function to fetch and populate SR numbers
        function fetchSrNumbers(labId, mainItemName, manufacturer, srNoSelect) {
            fetch(`/letterGenerate/get_sr_numbers/?lab_id=${labId}&main_item=${mainItemName}&manufacturer=${manufacturer}`)
                .then(response => response.json())
                .then(data => {
                    srNoSelect.innerHTML = '';
                    if (data.sr_numbers.length > 0) {
                        data.sr_numbers.forEach(srNo => {
                            const option = document.createElement('option');
                            option.value = srNo;
                            option.textContent = srNo;
                            srNoSelect.appendChild(option);
                        });
                    } else {
                        const option = document.createElement('option');
                        option.textContent = 'No SR Numbers found';
                        srNoSelect.appendChild(option);
                    }
                })
                .catch(error => console.error('Error fetching SR Numbers:', error));
        }
    
        // Event listener for main item change
        document.getElementById('main_item').addEventListener('change', function() {
            var mainItem = this.value;
            console.log(`Selected main item: ${mainItem}`);  // Debugging statement
    
            fetch(`/letterGenerate/get_manufacturers/?main_item=${mainItem}`)
                .then(response => {
                    console.log('Fetch response:', response);  // Debugging statement
                    return response.json();
                })
                .then(data => {
                    console.log('Fetched manufacturer names:', data.manufacturer_names);  // Debugging statement
    
                    var manufacturerSelect = document.getElementById('manufacturer');
                    manufacturerSelect.innerHTML = '';
    
                    if (data.manufacturer_names.length > 0) {
                        data.manufacturer_names.forEach(function(manufacturer) {
                            var option = document.createElement('option');
                            option.value = manufacturer;
                            option.textContent = manufacturer;
                            manufacturerSelect.appendChild(option);
                        });
    
                        // Automatically select the first manufacturer and fetch SR numbers
                        const firstManufacturer = data.manufacturer_names[0];
                        manufacturerSelect.value = firstManufacturer;
    
                        const labId = document.getElementById('lab_select').value;
                        fetchSrNumbers(labId, mainItem, firstManufacturer, document.querySelector(`#sr_no_1`));
                    } else {
                        var option = document.createElement('option');
                        option.textContent = 'No manufacturers found';
                        manufacturerSelect.appendChild(option);
                    }
                })
                .catch(error => console.error('Error fetching manufacturers:', error));
        });
    
        // Event listener for lab, main item, and manufacturer changes to fetch SR numbers
        function addSrNumberEventListeners(srNoSelect) {
            document.getElementById('lab_select').addEventListener('change', function() {
                const labId = this.value;
                const mainItemName = document.getElementById('main_item').value;
                const manufacturer = document.getElementById('manufacturer').value;
                fetchSrNumbers(labId, mainItemName, manufacturer, srNoSelect);
            });
    
            document.getElementById('main_item').addEventListener('change', function() {
                const labId = document.getElementById('lab_select').value;
                const mainItemName = this.value;
                const manufacturer = document.getElementById('manufacturer').value;
                fetchSrNumbers(labId, mainItemName, manufacturer, srNoSelect);
            });
    
            document.getElementById('manufacturer').addEventListener('change', function() {
                const labId = document.getElementById('lab_select').value;
                const mainItemName = document.getElementById('main_item').value;
                const manufacturer = this.value;
                fetchSrNumbers(labId, mainItemName, manufacturer, srNoSelect);
            });
        }
    
        // Dynamic addition of product sections
        let productId = 1;
    
        function addProduct() {
            const productDetails = document.getElementById('productDetails');
    
            // Create Product Section
            const productSection = document.createElement('div');
            productSection.classList.add('mb-6', 'border-b', 'pb-4', 'product-section');
    
            // Product Title
            const productTitle = document.createElement('h2');
            productTitle.style.color = '#3593aa';
            productTitle.classList.add('text-lg', 'font-semibold', 'mb-2');
            productTitle.textContent = `Product ${productId}`;
            productSection.appendChild(productTitle);
    
            // SR No Dropdown
            const srNoLabel = document.createElement('label');
            srNoLabel.textContent = 'SR No';
            srNoLabel.style.color = '#3593aa';
            srNoLabel.classList.add('block', 'text-gray-700', 'text-base', 'font-bold', 'mb-2');
            productSection.appendChild(srNoLabel);
    
            const srNoSelect = document.createElement('select');
            srNoSelect.setAttribute('id', `sr_no_${productId}`);
            srNoSelect.classList.add('border', 'border-gray-300', 'rounded', 'px-3', 'py-2', 'mb-2', 'w-full');
            productSection.appendChild(srNoSelect);
    
            // Add event listeners for fetching SR numbers
            addSrNumberEventListeners(srNoSelect);
    
            // Add Subproduct Button
            const addSubproductBtn = document.createElement('button');
            addSubproductBtn.innerHTML = '<i class="fas fa-plus"></i> Add Part information';
            addSubproductBtn.classList.add('bg-green-500', 'hover:bg-green-600', 'font-bold', 'py-2', 'px-4', 'rounded', 'mt-4', 'mr-2');
            addSubproductBtn.addEventListener('click', addSubproduct);
            productSection.appendChild(addSubproductBtn);
    
            // Delete Product Button
            const deleteProductBtn = document.createElement('button');
            deleteProductBtn.innerHTML = '<i class="fas fa-trash"></i> Delete';
            deleteProductBtn.classList.add('bg-red-500', 'hover:bg-red-600', 'font-bold', 'py-2', 'px-4', 'rounded', 'mt-4', 'ml-2');
            deleteProductBtn.addEventListener('click', () => {
                productSection.remove();
            });
            productSection.appendChild(deleteProductBtn);
    
            // Append the product section to the product details container
            productDetails.appendChild(productSection);
    
            // Increment the product ID for the next product
            productId++;
        }
    
        function addSubproduct(event) {
        const productSection = event.target.parentElement;

        // Find the number of existing subproducts
        const subproducts = productSection.querySelectorAll('.subproduct-section').length;

        // Create Subproduct Section
        const subproductSection = document.createElement('div');
        subproductSection.classList.add('ml-8', 'subproduct-section', 'border', 'border-gray-300', 'rounded', 'p-4', 'shadow-md', 'mb-4', 'mt-8');

        // Subproduct Title
        const subproductTitle = document.createElement('h4');
        subproductTitle.classList.add('text-lg', 'font-semibold', 'mb-2');
        subproductTitle.textContent = `Part Information ${subproducts + 1}`;
        subproductSection.appendChild(subproductTitle);

        // Input for Part Name
        const partNameLabel = document.createElement('label');
        partNameLabel.textContent = 'Part Name';
        partNameLabel.style.color = '#3593aa';
        partNameLabel.classList.add('block', 'text-gray-700', 'text-base', 'font-bold', 'mb-2');
        subproductSection.appendChild(partNameLabel);

        const partNameInput = document.createElement('input');
        partNameInput.classList.add('border', 'border-gray-300', 'rounded', 'px-3', 'py-2', 'mb-2', 'w-full');
        subproductSection.appendChild(partNameInput);

        // Dropdown for Type of Part
        const partTypes = ['Spare', 'Wear-n-Tear', 'Consumables'];
        const partTypeLabel = document.createElement('label');
        partTypeLabel.textContent = 'Type of Part';
        partTypeLabel.style.color = '#3593aa';
        partTypeLabel.classList.add('block', 'text-gray-700', 'text-base', 'font-bold', 'mb-2');
        subproductSection.appendChild(partTypeLabel);

        const partTypeSelect = document.createElement('select');
        partTypeSelect.classList.add('border', 'border-gray-300', 'rounded', 'px-3', 'py-2', 'mb-2', 'w-full');
        partTypes.forEach(type => {
            const option = document.createElement('option');
            option.textContent = type;
            partTypeSelect.appendChild(option);
        });
        subproductSection.appendChild(partTypeSelect);

        // Input for Specification
        const specLabel = document.createElement('label');
        specLabel.textContent = 'Specification';
        specLabel.style.color = '#3593aa';
        specLabel.classList.add('block', 'text-gray-700', 'text-base', 'font-bold', 'mb-2');
        subproductSection.appendChild(specLabel);

        const specInput = document.createElement('input');
        specInput.classList.add('border', 'border-gray-300', 'rounded', 'px-3', 'py-2', 'mb-2', 'w-full');
        subproductSection.appendChild(specInput);

        // Numeric input for Quantity
        const quantityLabel = document.createElement('label');
        quantityLabel.textContent = 'Quantity';
        quantityLabel.style.color = '#3593aa';
        quantityLabel.classList.add('block', 'text-gray-700', 'text-base', 'font-bold', 'mb-2');
        subproductSection.appendChild(quantityLabel);

        const quantityInput = document.createElement('input');
        quantityInput.setAttribute('type', 'number');
        quantityInput.classList.add('border', 'border-gray-300', 'rounded', 'px-3', 'py-2', 'mb-2', 'w-full');
        subproductSection.appendChild(quantityInput);

        // Append the subproduct section to the product section
        productSection.appendChild(subproductSection);
    }
    
        // Add initial product section on page load
        document.addEventListener('DOMContentLoaded', () => {
            addProduct();
        });
    
        // Add more product sections on button click
        document.getElementById('addProductBtn').addEventListener('click', addProduct);
    </script>
    

</body>


</html>
{%endblock%}
