<script>
   document.addEventListener('DOMContentLoaded', function () {
    const mainItemSelect = document.getElementById('main_item');
    const manufacturerNameInput = document.getElementById('manufacturer_name');
    const manufacturerSelect = document.getElementById('manufacturer_select');

    mainItemSelect.addEventListener('change', function () {
        const mainItem = mainItemSelect.value;
        if (mainItem) {
            fetch(`/letterGenerate/get_manufacturer_names/?main_item=${mainItem}`)
                .then(response => response.json())
                .then(data => {
                    if (data.manufacturer_names.length > 0) {
                        manufacturerNameInput.value = data.manufacturer_names.join(', ');
                    } else {
                        manufacturerNameInput.value = 'No manufacturers found';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    manufacturerNameInput.value = 'Error getting manufacturers';
                });

            fetch('/letterGenerate/get_manufacturers/')
                .then(response => response.json())
                .then(data => {
                    manufacturerSelect.innerHTML = '';
                    data.manufacturer_names.forEach(name => {
                        const option = document.createElement('option');
                        option.textContent = name;
                        manufacturerSelect.appendChild(option);
                    });
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        } else {
            manufacturerNameInput.value = '';
            manufacturerSelect.innerHTML = '';
        }
    });
});


  let productId = 1;


       function addProduct() {
    const productDetails = document.getElementById('productDetails');

    // Create Product Section
    const productSection = document.createElement('div');
    productSection.classList.add('mb-6', 'border-b', 'pb-4', 'product-section');

    // Product Title
    const productTitle = document.createElement('h2');
    productTitle.style.color = '#3593aa'; 
    productTitle.classList.add('text-lg', 'font-semibold', 'mb-2');
    productTitle.textContent = `Product ${productId}`;
    productSection.appendChild(productTitle);

    // Array of labels for each input field
    const labels = ['Product SR', 'Product Price', 'Buying Date', 'Department Name','Period of AMC Contract', 'Service Report Date', 'AMC Provider'];

    labels.forEach(label => {
        // Label
        const inputLabel = document.createElement('label');
        inputLabel.textContent = label;
        inputLabel.style.color = '#3593aa'; 
        inputLabel.classList.add('block', 'text-gray-700', 'text-base', 'font-bold', 'mb-1');
        productSection.appendChild(inputLabel);


        // Input field
        if (label === 'Product Name') {
            // Create a select element for dropdown
            const selectField = document.createElement('select');
            selectField.classList.add('border', 'border-gray-300', 'rounded', 'px-3', 'py-2', 'mb-4', 'w-full');
            
            // Populate options from database or static list
            // For example, you can fetch options from an API or define a static list
            const productNames = ['Product A', 'Product B', 'Product C']; // Replace this with your dynamic data
            
            // Add options to the select element
            productNames.forEach(name => {
                const option = document.createElement('option');
                option.textContent = name;
                selectField.appendChild(option);
            });
    
            // Append the select field to the product section
            productSection.appendChild(selectField);
        } else {
            // Create a regular text input field
            const inputField = document.createElement('input');
            inputField.setAttribute('type', label === 'Buying Date' || label === 'Service Report Date' ? 'date' : 'text');
            inputField.setAttribute('placeholder', label);
            inputField.classList.add('border', 'border-gray-300', 'rounded', 'px-3', 'py-2', 'mb-4', 'w-full');
            productSection.appendChild(inputField);
        }
        
    });
    

    // Add Subproduct Button
    const addSubproductBtn = document.createElement('button');
    addSubproductBtn.innerHTML = '<i class="fas fa-plus"></i> Add Subproduct';
    addSubproductBtn.classList.add('bg-green-500', 'hover:bg-green-600', 'font-bold', 'py-2', 'px-4', 'rounded', 'mt-4', 'mr-2');
    addSubproductBtn.addEventListener('click', addSubproduct);
    productSection.appendChild(addSubproductBtn);

    // Delete Product Button
    const deleteProductBtn = document.createElement('button');
    deleteProductBtn.innerHTML = '<i class="fas fa-trash"></i> Delete';
    deleteProductBtn.classList.add('bg-red-500', 'hover:bg-red-600', 'font-bold', 'py-2', 'px-4', 'rounded', 'mt-4', 'ml-2');
    deleteProductBtn.addEventListener('click', () => {
        productSection.remove();
    });
    productSection.appendChild(deleteProductBtn);

    productDetails.appendChild(productSection);

    productId++;
}

    function addSubproduct(event) {
        const productSection = event.target.parentElement;
    
        // Find the number of existing subproducts
        const subproducts = productSection.querySelectorAll('.subproduct-section').length;
    
        // Create Subproduct Section
        const subproductSection = document.createElement('div');
        subproductSection.classList.add('ml-8', 'subproduct-section', 'border', 'border-gray-300', 'rounded', 'p-4', 'shadow-md', 'mb-4', 'mt-8');
    
        // Subproduct Title
        const subproductTitle = document.createElement('h4');
        subproductTitle.classList.add('text-lg', 'font-semibold', 'mb-2');
        subproductTitle.textContent = `Part Information ${subproducts + 1}`;
        subproductSection.appendChild(subproductTitle);
    
        // Dropdown options for Part Name and Type of Part
        const partNames = ['Part A', 'Part B', 'Part C'];
        const partTypes = ['Type A', 'Type B', 'Type C'];
    
        // Dropdown for Part Name
        const partNameLabel = document.createElement('label');
        partNameLabel.textContent = 'Part Name';
        partNameLabel.style.color = '#3593aa';
        partNameLabel.classList.add('block', 'text-gray-700', 'text-base', 'font-bold', 'mb-2');
        subproductSection.appendChild(partNameLabel);
    
        const partNameSelect = document.createElement('select');
        partNameSelect.classList.add('border', 'border-gray-300', 'rounded', 'px-3', 'py-2', 'mb-2', 'w-full');
        partNames.forEach(name => {
            const option = document.createElement('option');
            option.textContent = name;
            partNameSelect.appendChild(option);
        });
        subproductSection.appendChild(partNameSelect);
    
        // Dropdown for Type of Part
        const partTypeLabel = document.createElement('label');
        partTypeLabel.textContent = 'Type of Part';
        partTypeLabel.style.color = '#3593aa';
        partTypeLabel.classList.add('block', 'text-gray-700', 'text-base', 'font-bold', 'mb-2');
        subproductSection.appendChild(partTypeLabel);
    
        const partTypeSelect = document.createElement('select');
        partTypeSelect.classList.add('border', 'border-gray-300', 'rounded', 'px-3', 'py-2', 'mb-2', 'w-full');
        partTypes.forEach(type => {
            const option = document.createElement('option');
            option.textContent = type;
            partTypeSelect.appendChild(option);
        });
        subproductSection.appendChild(partTypeSelect);
    
        // Additional Inputs (if any)
        const additionalInputs = ['Specification', 'Quantity'];
        additionalInputs.forEach(input => {
            const inputLabel = document.createElement('label');
            inputLabel.textContent = input;
            inputLabel.style.color = '#3593aa';
            inputLabel.classList.add('block', 'text-gray-700', 'text-base', 'font-bold', 'mb-2');
            subproductSection.appendChild(inputLabel);
    
            const inputField = document.createElement('input');
            inputField.setAttribute('type', 'text');
            inputField.setAttribute('placeholder', input);
            inputField.classList.add('border', 'border-gray-300', 'rounded', 'px-3', 'py-2', 'mb-2', 'w-full');
            subproductSection.appendChild(inputField);
        });
    
        // Delete Subproduct Button
        const deleteSubproductBtn = document.createElement('button');
        deleteSubproductBtn.innerHTML = '<i class="fas fa-trash"></i> Delete';
        deleteSubproductBtn.classList.add('bg-red-500', 'hover:bg-red-600', 'font-bold', 'py-2', 'px-4', 'rounded', 'mt-4');
        deleteSubproductBtn.addEventListener('click', () => {
            subproductSection.remove();
        });
        subproductSection.appendChild(deleteSubproductBtn);
    
        productSection.appendChild(subproductSection);
    }
    

    function submitForm() {
      const letterNo = document.getElementById('letter_no').value;
      const labName = document.getElementById('lab_name').value;
      const letterDate = document.getElementById('letter_date').value;
 
      const productSections = document.querySelectorAll('.product-section');
      const formData = [];
 
      productSections.forEach(productSection => {
          const productSR = productSection.querySelector('input[placeholder="Product SR"]').value;
          const productPrice = productSection.querySelector('input[placeholder="Product Price"]').value;
          const buyingDate = productSection.querySelector('input[placeholder="Buying Date"]').value;
          const productName = productSection.querySelector('input[placeholder="Product Name"]').value;
          const departmentName = productSection.querySelector('input[placeholder="Department Name"]').value;
          const subproductSections = productSection.querySelectorAll('.subproduct-section');
          const subproducts = [];
 
          subproductSections.forEach(subproductSection => {
              const subproduct = {
                  'Type of Part': subproductSection.querySelector('input[placeholder="Type of Part"]').value,
                  'Part Name': subproductSection.querySelector('input[placeholder="Part Name"]').value,
                  'Specification': subproductSection.querySelector('input[placeholder="Specification"]').value,
                  'Quantity': subproductSection.querySelector('input[placeholder="Quantity"]').value,
              
              };
              subproducts.push(subproduct);
          });
 
          const product = {
              'Product SR': productSR,
              'Product Price': productPrice,
              'Buying Date': buyingDate,
              'Product Name': productName,
              'Department Name': departmentName,
              'Subproducts': subproducts
          };
          formData.push(product);
      });
 
      // Combine letter and product data
      const requestData = {
          'letter_no': letterNo,
          'lab_name': labName,
          'letter_date': letterDate,
          'products': formData
      };
 
      // AJAX Request
      fetch('/letterGenerate/submit_form/', {
          method: 'POST',
          headers: {
              'Content-Type': 'application/json',
              'X-CSRFToken': getCookie('csrftoken') // Ensure you have a function to get the CSRF token from cookies
          },
          body: JSON.stringify(requestData)
      })
      .then(response => {
          if (!response.ok) {
              throw new Error('Network response was not ok');
          }
          return response.json();
      })
      .then(data => {
          console.log('Success:', data);
          alert("Data submitted successfully");
          // Handle success response as needed
      })
      .catch(error => {
          console.error('Error:', error);
          alert("Error in submitting form");
          // Handle error as needed
      });
  }
 
  function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
          const cookies = document.cookie.split(';');
          for (let i = 0; i < cookies.length; i++) {
              const cookie = cookies[i].trim();
              if (cookie.substring(0, name.length + 1) === (name + '=')) {
                  cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                  break;
              }
          }
      }
      return cookieValue;
  }
 
    </script>
