<!-- create_quotation.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Quotation</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .text-title-color {
            color: #3593aa;
        }

        .bg-color {
            color: #3593aa;
        }

        .bg-custom-color {
            background-color: #3593aa;
        }

        .bg-custom-color:hover {
            background-color: #2c7da0;
            /* Darker shade for hover effect */
        }
    </style>
</head>

<body class="bg-gray-100 p-8 font-sans">
    <div class="max-w-5xl mx-auto bg-white p-8 rounded shadow-lg">
        <h1 class="text-3xl font-bold mb-8 text-title-color">Create Quotation</h1>

        <form id="quotationForm" class="grid grid-cols-1 gap-4">

            {% csrf_token %}
       
            <div class="grid grid-cols-2 gap-4">
                <div class="mb-4">
                    <label for="subproduct" class="block text-sm font-semibold text-title-color">Subproduct:</label>
                    <select id="subproduct" name="subproduct"
                        class="w-full border-2 border-gray-300 px-4 py-2 rounded-md focus:outline-none focus:border-indigo-500" required>
                        {% for subproduct in subproducts %}
                        <option value="{{ subproduct.id }}">{{ subproduct.part_name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-4">
                    <label for="date" class="block text-sm font-semibold text-title-color">Date:</label>
                    <input type="date" id="date" name="date"
                        class="w-full border-2 border-gray-300 px-4 py-2 rounded-md focus:outline-none focus:border-indigo-500" required>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mt-4">
                <div class="mb-4">
                    <label for="ref_no" class="block text-sm font-semibold text-title-color">Ref No.:</label>
                    <input type="text" id="ref_no" name="ref_no"
                        class="w-full border-2 border-gray-300 px-4 py-2 rounded-md focus:outline-none focus:border-indigo-500" required>
                </div>

                <div class="mb-4">
                    <label for="unit_price" class="block text-sm font-semibold text-title-color">Unit Price:</label>
                    <input type="text" id="unit_price" name="unit_price"
                        class="w-full border-2 border-gray-300 px-4 py-2 rounded-md focus:outline-none focus:border-indigo-500" required>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mt-4">
                <div class="mb-4">
                    <label for="price_without_gst" class="block text-sm font-semibold text-title-color">Price Without GST:</label>
                    <input type="text" id="price_without_gst" name="price_without_gst"
                        class="w-full border-2 border-gray-300 px-4 py-2 rounded-md focus:outline-none focus:border-indigo-500" required>
                </div>

                <div class="mb-4">
                    <label for="price_with_gst" class="block text-sm font-semibold text-title-color">Price With GST:</label>
                    <input type="text" id="price_with_gst" name="price_with_gst"
                        class="w-full border-2 border-gray-300 px-4 py-2 rounded-md focus:outline-none focus:border-indigo-500" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="expected_delivery" class="block text-sm font-semibold text-title-color">Expected Delivery:</label>
                <input type="text" id="expected_delivery" name="expected_delivery"
                    class="w-full border-2 border-gray-300 px-4 py-2 rounded-md focus:outline-none focus:border-indigo-500" required>
            </div>

            <button type="submit"
                class="bg-custom-color text-white font-bold py-2 px-4 rounded">Submit</button>
        </form>
    </div>

    <script>
        document.getElementById('quotationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let formData = new FormData(this);
            fetch('/submit_quotation_info/', {
                    method: 'POST',
                    body: formData
                })
                .then(response => {
                    if (response.ok) {
                        alert('Form submitted successfully');
                        // Redirect or do something else on success
                    } else {
                        throw new Error('Failed to submit form');
                    }
                })
                .catch(error => {
                    console.error('Error submitting form:', error);
                    alert('Error: ' + error.message);
                });
        });
    </script>

</body>

</html>
