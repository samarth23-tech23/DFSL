<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container {
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-gray-100 p-3">
<div class="container bg-white rounded-lg shadow-md">
    <div class="bg-light px-4 py-3 border-bottom">
        <h2 class="text-lg font-semibold">Add Item</h2>
    </div>
    <div class="p-4">
        <form id="add-form" method="post" onsubmit="showSuccessPopup()">
            {% csrf_token %}
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" name="name" class="form-control">
            </div>
            <div class="mb-3">
                <label for="manufacturer" class="form-label">Manufacturer</label>
                <select id="manufacturer" name="manufacturer" class="form-select">
                    <option selected disabled>Select Manufacturer</option>
                    <!-- Add options dynamically here -->
                </select>
            </div> 
            <!-- Add other input fields here as needed -->
            <div class="text-end">
                <button type="submit" class="btn btn-primary">Add Item</button>
            </div>
        </form>
    </div>
</div>

<!-- Success Popup -->
<div id="success-popup" class="position-fixed inset-0 d-flex align-items-center justify-content-center bg-dark bg-opacity-50 text-white text-center" style="display: none;">
    <div class="bg-white rounded-lg shadow-lg p-4">
        <h2 class="text-xl font-bold mb-3">Success</h2>
        <p class="mb-0">Item added successfully.</p>
    </div>
</div>

<script>
    // Function to show success popup
    function showSuccessPopup() {
        const popup = document.getElementById('success-popup');
        popup.style.display = 'flex';
        // Hide the popup after 1 minute
        setTimeout(function() {
            popup.style.display = 'none';
        }, 1000); // 1 minute
    }
</script>
</body>
</html>
