{% extends 'sidebar.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Item</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 dark:bg-gray-900 p-6 md:p-8">

    <!-- Message Section -->
    {% if messages %}
    <div class="mb-4">
        {% for message in messages %}
        <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative" role="alert">
            <span class="block sm:inline">{{ message }}</span>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <div class="max-w-md mx-auto bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6">
        <h1 class="text-2xl font-bold mb-4">Edit Item</h1>
        <form action="{% url 'edit_item' form.instance.id %}" method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label for="name" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Name</label>
                <input type="text" id="name" name="name" value="{{ form.instance.name }}" class="mt-1 block w-full shadow-sm sm:border-gray-300 rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-gray-100">
            </div>
            <div class="mb-4">
                <label for="manufacturer" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Manufacturer</label>
                <input type="text" id="manufacturer" name="manufacturer" value="{{ form.instance.manufacturer.name }}" class="mt-1 block w-full shadow-sm sm:border-gray-300 rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-gray-100">
            </div>
            <div class="flex justify-end space-x-2">
                <a href="{% url 'item_list' %}" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-gray-700 dark:text-gray-300 bg-gray-200 dark:bg-gray-600 hover:bg-gray-300 dark:hover:bg-gray-500">Cancel</a>
                <button type="submit" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700">Save</button>
            </div>
        </form>
    </div>
</body>
</html>
{% endblock %}
