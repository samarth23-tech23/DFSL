<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="../static/css/sidebar.css"> -->
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins&display=swap');

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins',sans-serif;

}

body {
    min-height: 100vh;
    background-color: #fff;
}
#main-content {
    margin-left: 25%; /* Ensure main content starts after the sidebar */
    padding: 20px;
}
.main {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    width: 100%;
    overflow: hidden;
    transition: all 0.35s ease-in-out;
}
.content {
    flex: 1;
    max-width: 100vw;
    width: 100vw;
}
.navigation{
    position: fixed;
    top: 0px;
    left: 0px;
    bottom: 0px;
    width: 70px;
/* border-radius: 10px;  */
    box-sizing: initial;
    border-left: 5px solid #01a1df;
    background-color: #3ab1df; 
    transition: width 0.5s;
    overflow-x: hidden;
}


.navigation.active{ 
    width: 350px;
}
.navigation ul{
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    border-radius: 10px;
    padding-left: 5px;
    padding-top: 40px;
  
}


.navigation ul li{
    position: relative    ;
    list-style:  none;
    width: 100%;
    border-top-left-radius: 20px;
    border-bottom-left-radius: 20px;
}

.navigation ul li.active{
    background: #F5F5F5;
}
.navigation ul li b:nth-child(1)
{
    position: absolute;
    top: -20px;
    height: 20px;
    width: 100%;
    background: #F5F5F5 ;
    display: none;
}
.navigation ul li b:nth-child(1)::before{
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-bottom-right-radius: 20px;
    background: #3ab1df;
}



.navigation ul li b:nth-child(2)
{
    position: absolute;
    bottom: -20px;
    height: 20px;
    width: 100%;
    background: #3ab1df ;
    display: none;
}
.navigation ul li b:nth-child(2)::before{
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-top-right-radius: 20px;
    background: #3ab1df;
}

.navigation ul li.active b:nth-child(1),
.navigation ul li.active b:nth-child(2){
    display: block;
}


.navigation ul li a {
    position: relative;
    display: block;
    width: 100%;
    display: flex;
    text-decoration: none;
    color: #F5F5F5;
}
.navigation ul li.active a{
    color: #333;
}

.navigation ul li a .icon
{
    position: relative;
    display: block;
    min-width: 60px;
    height: 60px;
    line-height: 70px;
    text-align: center;
}
.navigation ul li a .icon ion-icon{
    font-size: 1.5em;
}
.navigation ul li a .title{
    position: relative;
    display: block;
    padding-left: 10px ;
    height: 60px;
    line-height: 60px;
    white-space: normal;
}

.toggle
{
    position: fixed;
    top: 20px;
    right: 20px;
    width: 50px;
    height: 50px;
    background: #3ab1df;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
}

.toggle.active{
    background-color: #ff4d89 ;
}

.toggle ion-icon{
    position: absolute;
    color: #fff;
    font-size: 34px;
    display: none;
}

.toggle ion-icon.open,
.toggle.active ion-icon.close{
    display: block;
}

.toggle ion-icon.close,
.toggle.active ion-icon.open{
    display: none;
}


    </style>
</head>
<body>
    <div class="navigation">
        <ul>
            
            <li class="list">
                <b></b>
                <b></b>
                <a href="/letterGenerate/form">
                    <span class="icon"><ion-icon name="create-outline"></ion-icon></span>
                    
                  <span class="title">Product Form</span>
                </a>
            </li>
            <li class="list">
                <b></b>
                <b></b>
                <a href="/letterGenerate/products">
                    <span class="icon"><ion-icon name="folder-open-outline"></ion-icon></span>
                    <span class="title">Office Quotation Request</span>
                </a>
            </li>
            <li class="list">
                <b></b>
                <b></b>
                <a href="/letterGenerate/products4">
                    <span class="icon"><ion-icon name="document-text-outline"></ion-icon></span>
                    <span class="title">Supplier Quotation Request</span>
                </a>
            </li>


            <li class="list">
                <b></b>
                <b></b>
                <a href="/letterGenerate/quotations">
                    <span class="icon"><ion-icon name="create-outline"></ion-icon></span>
                    
                <span class="title">Quotations Form</span>
                </a>
            </li>
            <li class="list">
                <b></b>
                <b></b>
                <a href="/letterGenerate/products6">
                    <span class="icon"><ion-icon name="checkbox-outline"></ion-icon></span>
                    <span class="title">Office Quotation Approval</span>
                </a>
            </li>
            <li class="list">
                <b></b>
                <b></b>
                <a href="/letterGenerate/products7">
                    <span class="icon"><ion-icon name="checkmark-done-outline"></ion-icon></span>
                    <span class="title">Supplier Quotation Approval</span>
                </a>
            </li>
        </ul>
    </div>
    <div class="toggle">
        <ion-icon name="menu-outline" class="open"></ion-icon>
        <ion-icon name="close-outline" class="close"></ion-icon>
    </div>
    <main class="content px-3 py-2">
        <div class="container-fluid">
            <div class="mb-3">
                {% block content %}{% endblock %}
            </div>
        </div>
    </main> 
    {% include 'footer.html' %}

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>    
<script>

let menuToggle = document.querySelector('.toggle');
let navigation = document.querySelector('.navigation');
menuToggle.onclick = function(){
    menuToggle.classList.toggle('active');
    navigation.classList.toggle('active');
}



    let list = document.querySelectorAll('.list');
    // console.dir(list)
    list.forEach((el,index) => el.addEventListener('click', () => {
            console.log("Element CLicked",index)
            
            localStorage.setItem('SelectedTabIndex',index)
        }))
        console.log([localStorage.getItem('SelectedTabIndex')])
        list[localStorage.getItem('SelectedTabIndex')].className= 'list active';
  
</script>
</body>
</html>
